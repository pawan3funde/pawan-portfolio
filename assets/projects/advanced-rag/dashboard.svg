    <text x="440" y="377" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="12">0.93 (+36.7%)</text>

    <text x="50" y="400" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">Top-K Context Hit Rate</text>
    <text x="240" y="400" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="12">62.1% (k=5)</text>
    <text x="440" y="400" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="12">91.8% (FlashRank)</text>
