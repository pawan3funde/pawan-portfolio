    <text x="40" y="367" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; FastAPI Asynchronous Gateway</text>
    <text x="40" y="389" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; NeMo Guardrails + Portkey Gateway</text>
