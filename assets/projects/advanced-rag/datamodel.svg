<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#archBg)" rx="12"/>

  <!-- Top Bar -->
  <rect x="20" y="20" width="1160" height="60" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="45" y="56" fill="#f8fafc" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="18" font-weight="700">ADVANCED RAG PIPELINE &bull; DATA &amp; AGENTIC SYSTEM ARCHITECTURE</text>
  <rect x="980" y="35" width="180" height="30" fill="#0f172a" rx="4" stroke="#38bdf8" stroke-width="1"/>
  <text x="995" y="55" fill="#38bdf8" font-family="'JetBrains Mono', sans-serif" font-size="12">End-to-End Pipeline</text>

  <!-- Flow Boxes -->
  <!-- Layer 1: Ingestion & Preprocessing -->
  <g transform="translate(30, 110)">
    <rect width="255" height="490" fill="#1e293b" rx="8" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="225" height="36" fill="#0369a1" rx="4"/>
    <text x="25" y="39" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">1. Data Ingestion &amp; Prep</text>

    <!-- Sub-block A -->
    <rect x="15" y="70" width="225" height="85" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="95" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Unstructured Ingest</text>
    <text x="25" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">PDF, DOCX, Markdown,</text>
    <text x="25" y="138" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">HTML, Structured Tables</text>

    <!-- Sub-block B -->
    <rect x="15" y="170" width="225" height="85" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="195" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">NLP Text Chunking</text>
    <text x="25" y="218" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Semantic &amp; Context-Aware</text>
    <text x="25" y="238" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Sliding Window + Metadata</text>

    <!-- Sub-block C -->
    <rect x="15" y="270" width="225" height="85" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="295" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Embedding Engine</text>
    <text x="25" y="318" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Dense Vector Embeddings</text>
    <text x="25" y="338" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">1536-dim normalized float</text>

    <!-- Sub-block D -->
    <rect x="15" y="370" width="225" height="100" fill="#0f172a" rx="6" stroke="#0284c7"/>
    <text x="25" y="395" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Qdrant Vector DB</text>
    <text x="25" y="418" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">HNSW Cosine Indexing</text>
    <text x="25" y="438" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Payload Filtering &amp; Sharding</text>
  </g>

  <!-- Layer 2: Retrieval & Reranking Engine -->
  <g transform="translate(325, 110)">
    <rect width="255" height="490" fill="#1e293b" rx="8" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="225" height="36" fill="#4338ca" rx="4"/>
    <text x="25" y="39" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">2. Retrieval &amp; Reranking</text>

    <rect x="15" y="70" width="225" height="95" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="95" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Hybrid Query Search</text>
    <text x="25" y="118" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Dense Semantic Similarity +</text>
    <text x="25" y="138" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Sparse Keyword Match</text>
    <text x="25" y="155" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Candidate Pool: Top-20</text>

    <rect x="15" y="180" width="225" height="110" fill="#0f172a" rx="6" stroke="#818cf8"/>
    <text x="25" y="205" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">FlashRank Reranker</text>
    <text x="25" y="228" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Cross-Encoder Neural Model</text>
    <text x="25" y="248" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Ultra-light CPU Inference</text>
    <text x="25" y="270" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11">Re-orders Top-5 Context</text>

    <rect x="15" y="305" width="225" height="95" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="330" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Document Grader</text>
    <text x="25" y="353" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">LLM Binary Relevance Filter</text>
    <text x="25" y="375" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Drops Irrelevant Chunks</text>

    <rect x="15" y="415" width="225" height="60" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="440" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">&#10003; Clean Grounded Context</text>
    <text x="25" y="460" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Delivered to Agent Graph</text>
  </g>

  <!-- Layer 3: Agentic Reasoning & Guardrails -->
  <g transform="translate(620, 110)">
    <rect width="255" height="490" fill="#1e293b" rx="8" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="15" y="15" width="225" height="36" fill="#be123c" rx="4"/>
    <text x="25" y="39" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">3. LangGraph &amp; Security</text>

    <rect x="15" y="70" width="225" height="110" fill="#0f172a" rx="6" stroke="#f43f5e"/>
    <text x="25" y="95" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">LangGraph State Loop</text>
    <text x="25" y="118" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Multi-step Agent Reasoning</text>
    <text x="25" y="138" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Conditional Routing &amp; Loops</text>
    <text x="25" y="160" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10">Fallback query transforms</text>

    <rect x="15" y="195" width="225" height="110" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="220" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">NeMo Guardrails</text>
    <text x="25" y="243" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Input/Output Moderation</text>
    <text x="25" y="263" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Hallucination Checks</text>
    <text x="25" y="285" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Jailbreak Prevention</text>

    <rect x="15" y="320" width="225" height="85" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="345" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Portkey Gateway</text>
    <text x="25" y="368" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Load-balancing, Retries,</text>
    <text x="25" y="388" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Caching &amp; Token Analytics</text>

    <rect x="15" y="420" width="225" height="55" fill="#0f172a" rx="6" stroke="#10b981"/>
    <text x="25" y="445" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">&#10003; FastAPI Async Delivery</text>
    <text x="25" y="462" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Streaming token responses</text>
  </g>

  <!-- Layer 4: Evaluation & Cloud Infrastructure -->
  <g transform="translate(915, 110)">
    <rect width="255" height="490" fill="#1e293b" rx="8" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="225" height="36" fill="#047857" rx="4"/>
    <text x="25" y="39" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">4. Evaluation &amp; Cloud</text>

    <rect x="15" y="70" width="225" height="120" fill="#0f172a" rx="6" stroke="#10b981"/>
    <text x="25" y="95" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">RAGAS Evaluation</text>
    <text x="25" y="118" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">&bull; Faithfulness: 94.8%</text>
    <text x="25" y="138" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">&bull; Context Precision: 0.91</text>
    <text x="25" y="158" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">&bull; Answer Relevancy: 0.93</text>
    <text x="25" y="178" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">&bull; Context Recall: 0.89</text>

    <rect x="15" y="205" width="225" height="120" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="230" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">GCP &amp; Terraform</text>
    <text x="25" y="253" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Infrastructure as Code (IaC)</text>
    <text x="25" y="273" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Automated GCP provisioning</text>
    <text x="25" y="293" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Cloud Run Containerized</text>
    <text x="25" y="313" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">VPC &amp; IAM Security Policies</text>

    <rect x="15" y="340" width="225" height="135" fill="#0f172a" rx="6" stroke="#334155"/>
    <text x="25" y="365" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Roadmap &amp; Next Steps</text>
    <text x="25" y="388" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">&bull; Multimodal RAG</text>
    <text x="25" y="408" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">&bull; Voice Interaction</text>
    <text x="25" y="428" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">&bull; Fine-tuned Reranker</text>
    <text x="25" y="448" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">&bull; Latency Compression</text>
  </g>
</svg>
