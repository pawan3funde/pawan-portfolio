<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="seBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#seBg)" rx="12"/>

  <!-- Top Bar -->
  <rect x="20" y="20" width="1160" height="60" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="45" y="56" fill="#f8fafc" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="18" font-weight="700">POWER BI &bull; SHOPEASE MULTI-STORE OPERATIONAL DASHBOARD</text>
  <rect x="850" y="35" width="140" height="30" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="865" y="55" fill="#94a3b8" font-family="'JetBrains Mono', sans-serif" font-size="12">8 Store Outlets</text>
  <rect x="1005" y="35" width="155" height="30" fill="#10b981" rx="4"/>
  <text x="1025" y="55" fill="#022c22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Status: Automated</text>

  <!-- KPI Cards -->
  <g transform="translate(20, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">TOTAL MULTI-STORE SALES</text>
    <text x="20" y="74" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">&#8377;1.84 Cr</text>
    <text x="20" y="96" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12">&#9650; +11.4% vs Target</text>
  </g>

  <g transform="translate(315, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">AVERAGE ORDER VALUE</text>
    <text x="20" y="74" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">&#8377;2,140</text>
    <text x="20" y="96" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12">Median Basket: 3.2 items</text>
  </g>

  <g transform="translate(610, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">RETURN RATE (%)</text>
    <text x="20" y="74" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">4.12%</text>
    <text x="20" y="96" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12">&#9660; -1.8% Down from 5.9%</text>
  </g>

  <g transform="translate(905, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">DISPATCH SLA COMPLIANCE</text>
    <text x="20" y="74" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">97.6%</text>
    <text x="20" y="96" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12">&lt;24 Hour Dispatch</text>
  </g>

