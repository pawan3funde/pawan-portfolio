      <rect x="220" y="5" width="400" height="16" fill="#10b981" rx="2"/>
      <text x="630" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">118%</text>

      <text x="0" y="48" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">Store 02 (Pune West)</text>
      <rect x="220" y="35" width="360" height="16" fill="#10b981" rx="2"/>
      <text x="630" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">106%</text>

      <text x="0" y="78" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">Store 03 (Bangalore North)</text>
      <rect x="220" y="65" width="380" height="16" fill="#10b981" rx="2"/>
      <text x="630" y="78" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">112%</text>

      <text x="0" y="108" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">Store 04 (Delhi NCR)</text>
      <rect x="220" y="95" width="310" height="16" fill="#fbbf24" rx="2"/>
      <text x="630" y="108" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">92%</text>

      <text x="0" y="138" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">Store 05 (Hyderabad East)</text>
      <rect x="220" y="125" width="280" height="16" fill="#fbbf24" rx="2"/>
      <text x="630" y="138" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">88%</text>
    </g>
  </g>

  <!-- Middle Right: Category Contribution -->
  <g transform="translate(735, 220)">
    <rect width="445" height="235" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600">Category Revenue Share</text>
    
    <g transform="translate(20, 60)">
