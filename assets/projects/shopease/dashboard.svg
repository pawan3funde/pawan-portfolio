      <text x="40" y="24" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Apparel &amp; Fashion (38%)</text>

      <circle cx="20" cy="55" r="10" fill="#10b981"/>
      <text x="40" y="59" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Electronics &amp; Gadgets (31%)</text>

      <circle cx="20" cy="90" r="10" fill="#fbbf24"/>
      <text x="40" y="94" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Home &amp; Kitchen (19%)</text>

      <circle cx="20" cy="125" r="10" fill="#a78bfa"/>
      <text x="40" y="129" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Beauty &amp; Personal Care (12%)</text>
    </g>
  </g>

  <!-- Bottom Table -->
  <g transform="translate(20, 470)">
    <rect width="1160" height="185" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Data Modeling: Normalized Dimensions &amp; Automated Pipeline Health</text>
    <rect x="20" y="45" width="1120" height="30" fill="#0f172a" rx="4"/>
    <text x="35" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">FEED NAME</text>
    <text x="220" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">DATA SOURCE</text>
    <text x="450" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">REFRESH CADENCE</text>
    <text x="700" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">TRANSFORMATION STEPS</text>
    <text x="1000" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">HEALTH</text>

    <text x="35" y="102" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12">POS_Transactions</text>
    <text x="220" y="102" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">PostgreSQL Database</text>
    <text x="450" y="102" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">Daily Scheduled (04:00 AM)</text>
    <text x="700" y="102" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">Power Query: Unpivot &amp; Tax Normalization</text>
    <text x="1000" y="102" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">ACTIVE</text>
