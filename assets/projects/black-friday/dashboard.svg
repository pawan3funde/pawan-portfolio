  <!-- Middle Right: Age & City Breakdown -->
  <g transform="translate(735, 220)">
    <rect width="445" height="235" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600">Demographic Spend Distribution</text>
    
    <g transform="translate(20, 60)">
      <text x="0" y="18" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">Age 26-35 (Metro)</text>
      <rect x="140" y="5" width="220" height="16" fill="#fbbf24" rx="2"/>
      <text x="370" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">42%</text>

      <text x="0" y="48" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">Age 18-25 (Tier 1)</text>
      <rect x="140" y="35" width="150" height="16" fill="#38bdf8" rx="2"/>
      <text x="300" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">29%</text>

      <text x="0" y="78" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">Age 36-45 (Suburban)</text>
      <rect x="140" y="65" width="95" height="16" fill="#10b981" rx="2"/>
      <text x="245" y="78" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">18%</text>

      <text x="0" y="108" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">Age 46+ (Tier 2/3)</text>
      <rect x="140" y="95" width="60" height="16" fill="#a78bfa" rx="2"/>
      <text x="210" y="108" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11">11%</text>
    </g>
  </g>

  <!-- Bottom: Summary -->
  <g transform="translate(20, 470)">
    <rect width="1160" height="185" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Executive Commercial Recommendations &amp; Margin Strategy</text>
    
    <g transform="translate(30, 55)">
      <circle cx="10" cy="10" r="4" fill="#fbbf24"/>
      <text x="25" y="14" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13"><strong>Product Cross-Selling:</strong> Electronics buyers had a 3.4x higher likelihood of purchasing High-Margin Accessories within 48 hours.</text>

      <circle cx="10" cy="40" r="4" fill="#10b981"/>
      <text x="25" y="44" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13"><strong>Discount Optimization:</strong> Reducing blanket discount from 25% to 15% with targeted loyalty cashback preserved 8.2% gross profit margins.</text>

      <circle cx="10" cy="70" r="4" fill="#38bdf8"/>
      <text x="25" y="74" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13"><strong>Inventory Allocation:</strong> Reallocated 30% safety stock of fast-moving SKUs to Northern regional hubs based on predictive demand modeling.</text>
    </g>
