<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#171923"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bfBg)" rx="12"/>

  <!-- Top Bar -->
  <rect x="20" y="20" width="1160" height="60" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="45" y="56" fill="#f8fafc" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="18" font-weight="700">POWER BI &bull; BLACK FRIDAY SALES &amp; RFM SEGMENTATION</text>
  <rect x="850" y="35" width="140" height="30" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="865" y="55" fill="#94a3b8" font-family="'JetBrains Mono', sans-serif" font-size="12">6,000+ Buyers</text>
  <rect x="1005" y="35" width="155" height="30" fill="#f59e0b" rx="4"/>
  <text x="1025" y="55" fill="#18181b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Gross: &#8377;5.1 Billion</text>

  <!-- KPI Cards -->
  <g transform="translate(20, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">TOTAL REVENUE VOLUME</text>
    <text x="20" y="74" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">&#8377;5.12 B</text>
    <text x="20" y="96" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12">&#9650; +28% YoY Campaign Growth</text>
  </g>

  <g transform="translate(315, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">TOP TIER CHAMPIONS</text>
    <text x="20" y="74" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">15.2%</text>
    <text x="20" y="96" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12">Generates 48.6% of GMV</text>
  </g>

  <g transform="translate(610, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">AVG BASKET SIZE (AOV)</text>
    <text x="20" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">&#8377;9,420</text>
    <text x="20" y="96" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12">&#9650; Up from &#8377;7,800</text>
  </g>

  <g transform="translate(905, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">AT-RISK SEGMENT</text>
    <text x="20" y="74" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">18.4%</text>
    <text x="20" y="96" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="12">Win-back coupon trigger</text>
  </g>

