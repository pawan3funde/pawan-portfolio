    <rect width="700" height="235" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600">RFM Customer Quintile Heatmap (Power BI Matrix)</text>
    
    <!-- Matrix Cells -->
    <g transform="translate(40, 55)">
      <!-- Champions -->
      <rect x="0" y="0" width="180" height="75" fill="#0284c7" rx="4"/>
      <text x="15" y="25" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Champions (555, 554)</text>
      <text x="15" y="45" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="11">920 Users &bull; &#8377;2.48 B</text>
      <text x="15" y="62" fill="#bae6fd" font-family="'Segoe UI', sans-serif" font-size="10">Action: VIP Early Access</text>

      <!-- Loyal Customers -->
      <rect x="195" y="0" width="180" height="75" fill="#0d9488" rx="4"/>
      <text x="15" y="25" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Loyal Customers</text>
      <text x="15" y="45" fill="#ccfbf1" font-family="'JetBrains Mono', monospace" font-size="11">1,410 Users &bull; &#8377;1.12 B</text>
      <text x="15" y="62" fill="#99f6e4" font-family="'Segoe UI', sans-serif" font-size="10">Action: Upsell Bundles</text>

      <!-- Potential Loyalists -->
      <rect x="390" y="0" width="180" height="75" fill="#3b82f6" rx="4"/>
      <text x="15" y="25" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Potential Loyalists</text>
      <text x="15" y="45" fill="#dbeafe" font-family="'JetBrains Mono', monospace" font-size="11">1,240 Users &bull; &#8377;680 M</text>
      <text x="15" y="62" fill="#bfdbfe" font-family="'Segoe UI', sans-serif" font-size="10">Action: Loyalty Program</text>

      <!-- At Risk -->
      <rect x="0" y="85" width="180" height="75" fill="#d97706" rx="4"/>
      <text x="15" y="25" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">At Risk Customers</text>
      <text x="15" y="45" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="11">1,120 Users &bull; &#8377;420 M</text>
      <text x="15" y="62" fill="#fde68a" font-family="'Segoe UI', sans-serif" font-size="10">Action: Personalized Re-engagement</text>

      <!-- Hibernating / Lost -->
      <rect x="195" y="85" width="180" height="75" fill="#e11d48" rx="4"/>
      <text x="15" y="25" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Hibernating / Lost</text>
      <text x="15" y="45" fill="#ffe4e6" font-family="'JetBrains Mono', monospace" font-size="11">890 Users &bull; &#8377;190 M</text>
      <text x="15" y="62" fill="#fecdd3" font-family="'Segoe UI', sans-serif" font-size="10">Action: Aggressive Discount</text>

      <!-- Need Attention -->
      <rect x="390" y="85" width="180" height="75" fill="#6366f1" rx="4"/>
      <text x="15" y="25" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Need Attention</text>
      <text x="15" y="45" fill="#e0e7ff" font-family="'JetBrains Mono', monospace" font-size="11">420 Users &bull; &#8377;230 M</text>
      <text x="15" y="62" fill="#c7d2fe" font-family="'Segoe UI', sans-serif" font-size="10">Action: Limited-time Deals</text>
