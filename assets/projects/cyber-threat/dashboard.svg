    <text x="20" y="28" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Top Detected Malicious Origin IP Clusters (Dynamic DAX Anomaly Scoring)</text>

    <!-- Table Header -->
    <rect x="20" y="45" width="1120" height="30" fill="#0f172a" rx="4"/>
    <text x="35" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">SOURCE IP</text>
    <text x="220" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">GEO COUNTRY</text>
    <text x="420" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">FAILED ATTEMPTS</text>
    <text x="640" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">TARGET PROTOCOL</text>
    <text x="860" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">ANOMALY RISK SCORE</text>
    <text x="1050" y="65" fill="#64748b" font-family="'JetBrains Mono', sans-serif" font-size="11" font-weight="600">STATUS</text>

    <!-- Row 1 -->
    <text x="35" y="102" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">185.220.101.44</text>
    <text x="220" y="102" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">Tor Exit Node (NL)</text>
    <text x="420" y="102" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">14,280 req / hr</text>
    <text x="640" y="102" fill="#e2e8f0" font-family="'JetBrains Mono', sans-serif" font-size="12">Port 22 (SSH)</text>
    <rect x="860" y="88" width="100" height="18" fill="#f43f5e" rx="3"/>
    <text x="895" y="101" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">98 / 100</text>
    <text x="1050" y="102" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">FLAGGED</text>

    <!-- Row 2 -->
    <text x="35" y="136" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">45.154.255.89</text>
    <text x="220" y="136" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">Hosting Provider (DE)</text>
    <text x="420" y="136" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">6,410 req / hr</text>
    <text x="640" y="136" fill="#e2e8f0" font-family="'JetBrains Mono', sans-serif" font-size="12">Port 3389 (RDP)</text>
    <rect x="860" y="122" width="100" height="18" fill="#fb923c" rx="3"/>
    <text x="895" y="135" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">84 / 100</text>
    <text x="1050" y="136" fill="#fb923c" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">ISOLATED</text>
