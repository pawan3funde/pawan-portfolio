    <text x="20" y="48" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Statistical Z-score &gt; 2.5 deviation highlighted in red</text>

    <!-- Chart gridlines -->
    <line x1="50" y1="80" x2="670" y2="80" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="50" y1="130" x2="670" y2="130" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="50" y1="180" x2="670" y2="180" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Wave fill -->
    <path d="M 50 180 Q 120 160 180 170 T 320 150 T 420 70 T 520 160 T 670 175 L 670 205 L 50 205 Z" fill="url(#cyanGrad)" opacity="0.15"/>
    <path d="M 50 180 Q 120 160 180 170 T 320 150 T 420 70 T 520 160 T 670 175" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Anomaly Spike Indicator -->
