<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Dashboard Top Bar -->
  <rect x="20" y="20" width="1160" height="60" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="45" y="56" fill="#f8fafc" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="18" font-weight="700">POWER BI &bull; CYBER THREAT &amp; AUTH ANOMALY INTELLIGENCE</text>
  <rect x="860" y="35" width="130" height="30" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="880" y="55" fill="#94a3b8" font-family="'JetBrains Mono', sans-serif" font-size="12">Live Stream: ON</text>
  <rect x="1005" y="35" width="155" height="30" fill="#06b6d4" rx="4"/>
  <text x="1025" y="55" fill="#04121d" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Filter: Last 30 Days</text>

  <!-- KPI Cards Row -->
  <!-- Card 1 -->
  <g transform="translate(20, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">TOTAL INGESTED LOGS</text>
    <text x="20" y="74" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">548,210</text>
    <text x="20" y="96" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12">&#9650; +14.2% vs previous run</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(315, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">SUSPICIOUS IP CLUSTERS</text>
    <text x="20" y="74" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">1,482</text>
    <text x="20" y="96" fill="#fb7185" font-family="'Segoe UI', sans-serif" font-size="12">&#9888; 28 High-Risk Brute Force</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(610, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">FAILED AUTH RATIO</text>
    <text x="20" y="74" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">7.64%</text>
    <text x="20" y="96" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12">&#9660; -2.1% Post Rule Enforcement</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(905, 95)">
    <rect width="275" height="110" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">MEAN TIME TO DETECT</text>
    <text x="20" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">4.2 min</text>
    <text x="20" y="96" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12">&#9660; -64% latency reduction</text>
