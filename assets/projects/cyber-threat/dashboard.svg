      <text x="20" y="11" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">SSH / RDP Brute Force (64%)</text>
      
      <rect x="0" y="30" width="12" height="12" fill="#38bdf8" rx="2"/>
      <text x="20" y="41" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Port Scanning Sweep (24%)</text>
      
