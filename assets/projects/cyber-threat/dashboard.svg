    <rect x="370" y="35" width="105" height="24" fill="#f43f5e" rx="4"/>
    <text x="378" y="51" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SPIKE: 1,840 REQ</text>
  </g>

  <!-- Middle Right: Donut Chart & Threat Breakdown -->
  <g transform="translate(735, 220)">
    <rect width="445" height="235" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600">Attack Vector Distribution</text>
    
    <!-- Donut representation -->
