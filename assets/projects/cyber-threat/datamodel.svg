<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <linearGradient id="dmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="550" fill="url(#dmBg)" rx="12"/>

  <!-- Title -->
  <text x="30" y="45" fill="#f8fafc" font-family="'JetBrains Mono', sans-serif" font-size="18" font-weight="700">POWER BI STAR SCHEMA ARCHITECTURE</text>
  <text x="30" y="68" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">1-to-Many Single Direction Cardinality &bull; Optimized Integer Surrogate Keys</text>

  <!-- Dimension 1: Dim_Date (Top Left) -->
  <g transform="translate(60, 110)">
    <rect width="220" height="150" fill="#1e293b" rx="6" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="220" height="32" fill="#0284c7" rx="6 6 0 0"/>
    <text x="15" y="22" fill="#ffffff" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="700">DIM_DATE</text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">&#128273; DateKey [PK - Int]</text>
    <text x="15" y="75" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; FullDate [Date]</text>
    <text x="15" y="95" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; HourOfDay [0-23]</text>
    <text x="15" y="115" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; DayOfWeek [Varchar]</text>
    <text x="15" y="135" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; IsBusinessHour [Bit]</text>
  </g>

  <!-- Dimension 2: Dim_IPAddress (Bottom Left) -->
  <g transform="translate(60, 320)">
    <rect width="220" height="150" fill="#1e293b" rx="6" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="220" height="32" fill="#0284c7" rx="6 6 0 0"/>
    <text x="15" y="22" fill="#ffffff" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="700">DIM_IP_ADDRESS</text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">&#128273; IPKey [PK - Int]</text>
    <text x="15" y="75" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; IPv4_Address [Varchar]</text>
    <text x="15" y="95" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; GeoCountry [Varchar]</text>
    <text x="15" y="115" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; ASN_Provider [Varchar]</text>
    <text x="15" y="135" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; IsTorExitNode [Bit]</text>
  </g>

  <!-- Center Fact Table: Fact_AuthEvents -->
  <g transform="translate(390, 170)">
    <rect width="250" height="240" fill="#0f172a" rx="8" stroke="#f43f5e" stroke-width="2"/>
    <rect width="250" height="36" fill="#e11d48" rx="8 8 0 0"/>
    <text x="15" y="24" fill="#ffffff" font-family="'JetBrains Mono', sans-serif" font-size="13" font-weight="800">FACT_AUTH_EVENTS (500K+)</text>
    <text x="15" y="60" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">&#128273; EventID [PK]</text>
    <text x="15" y="80" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">&#128279; DateKey [FK &rarr; Dim_Date]</text>
    <text x="15" y="100" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">&#128279; IPKey [FK &rarr; Dim_IP]</text>
    <text x="15" y="120" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">&#128279; UserKey [FK &rarr; Dim_User]</text>
    <text x="15" y="140" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">&#128279; EndpointKey [FK &rarr; Dim_Endpoint]</text>
    <text x="15" y="165" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">&bull; AuthStatusCode [Int]</text>
    <text x="15" y="185" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">&bull; FailureCount [Measure]</text>
    <text x="15" y="205" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">&bull; AnomalyScore_Raw [Dec]</text>
    <text x="15" y="225" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">&bull; RiskIndex [DAX Calc]</text>
  </g>

  <!-- Dimension 3: Dim_User (Top Right) -->
  <g transform="translate(730, 110)">
    <rect width="210" height="150" fill="#1e293b" rx="6" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="210" height="32" fill="#0284c7" rx="6 6 0 0"/>
    <text x="15" y="22" fill="#ffffff" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="700">DIM_USER_ACCOUNT</text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">&#128273; UserKey [PK - Int]</text>
    <text x="15" y="75" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; Username [Varchar]</text>
    <text x="15" y="95" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; Department [Varchar]</text>
    <text x="15" y="115" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; PrivilegeLevel [Int]</text>
    <text x="15" y="135" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; IsAdminAccount [Bit]</text>
  </g>

  <!-- Dimension 4: Dim_Endpoint (Bottom Right) -->
  <g transform="translate(730, 320)">
    <rect width="210" height="150" fill="#1e293b" rx="6" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="210" height="32" fill="#0284c7" rx="6 6 0 0"/>
    <text x="15" y="22" fill="#ffffff" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="700">DIM_ENDPOINT</text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">&#128273; EndpointKey [PK - Int]</text>
    <text x="15" y="75" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; Hostname [Varchar]</text>
    <text x="15" y="95" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; SubnetSegment [Varchar]</text>
    <text x="15" y="115" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; ExposedPort [Int]</text>
    <text x="15" y="135" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">&bull; SecurityTier [Varchar]</text>
  </g>

  <!-- Connectors (1 to Many) -->
  <path d="M 280 185 L 390 230" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  <text x="290" y="180" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">1</text>
  <text x="375" y="220" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">&infin;</text>

  <path d="M 280 395 L 390 330" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  <text x="290" y="390" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">1</text>
  <text x="375" y="340" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">&infin;</text>

  <path d="M 730 185 L 640 230" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  <text x="715" y="180" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">1</text>
  <text x="655" y="220" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">&infin;</text>

  <path d="M 730 395 L 640 330" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  <text x="715" y="390" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">1</text>
  <text x="655" y="340" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">&infin;</text>
</svg>
